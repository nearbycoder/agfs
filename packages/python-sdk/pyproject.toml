[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "agfs-sdk"
version = "0.3.0"
description = "Official Python SDK for AGFS"
readme = "README.md"
requires-python = ">=3.10"
[project.urls]
Repository = "https://github.com/nearbycoder/agfs"
[tool.setuptools.packages.find]
include = ["agfs_sdk*"]
