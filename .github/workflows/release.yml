name: Publish packages
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'nearbycoder/agfs'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install -g npm@12.0.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm build && pnpm check
      - name: Pack and verify executable metadata
        run: node scripts/release-packages.mjs
      - name: Publish SDK with OIDC provenance
        run: node scripts/publish-package.mjs sdk
      - name: Publish CLI with OIDC provenance
        run: node scripts/publish-package.mjs cli
      - name: Verify installed CLI
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          for attempt in 1 2 3 4 5 6; do
            if npm exec --yes --prefer-online --package="@agfs/cli@$version" -- agfs --version; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          exit 1
