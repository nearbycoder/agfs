name: Publish packages
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'nearbycoder/agfs'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install -g npm@12.2.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm build && pnpm check
      - name: Pack and verify executable metadata
        run: node scripts/release-packages.mjs
      - name: Publish SDK with OIDC provenance
        run: node scripts/publish-package.mjs sdk
      - name: Publish CLI with OIDC provenance
        run: node scripts/publish-package.mjs cli
      - name: Verify installed CLI
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          for attempt in 1 2 3 4 5 6; do
            if npm exec --yes --prefer-online --package="@agfs/cli@$version" -- agfs --version; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          exit 1
